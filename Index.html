<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Grid</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: contain;
      border-radius: 4px;
    }

    .card span {
      margin-top: 8px;
      font-size: 12px;
      color: #8b949e;
      text-align: center;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div class="grid" id="gallery">Loading images...</div>

  <script>
    const imageExtensions = ['.png', '.svg', '.jpg', '.jpeg', '.webp', '.gif', '.avif'];

    async function loadImages() {
      const gallery = document.getElementById('gallery');

      try {
        // Fetch current directory HTML index provided by GitHub Pages / Web server
        const response = await fetch('./');
        const text = await response.text();

        // Parse returned directory HTML
        const parser = new DOMParser();
        const doc = parser.parseFromString(text, 'text/html');
        const links = Array.from(doc.querySelectorAll('a'));

        // Extract relative hrefs matching image extensions
        const images = links
          .map(link => link.getAttribute('href'))
          .filter(href => href && imageExtensions.some(ext => href.toLowerCase().endsWith(ext)));

        gallery.innerHTML = '';

        if (images.length === 0) {
          gallery.innerHTML = '<p>No images found in this directory.</p>';
          return;
        }

        images.forEach(filename => {
          const card = document.createElement('div');
          card.className = 'card';

          const img = document.createElement('img');
          img.src = filename;
          img.alt = filename;
          img.loading = 'lazy';

          const name = document.createElement('span');
          name.textContent = decodeURIComponent(filename);

          card.appendChild(img);
          card.appendChild(name);
          gallery.appendChild(card);
        });

      } catch (error) {
        gallery.innerHTML = '<p>Unable to automatically scan directory.</p>';
      }
    }

    loadImages();
  </script>
</body>
</html>
